<!doctype html><html lang="en"><meta charset="utf-8"><title>NoemaTrace · product capture</title><style>html,body{margin:0;background:#151517}iframe{position:absolute;left:32px;top:32px;border:0;transform:scale(2);transform-origin:top left}#park{position:absolute;left:0;top:0;width:24px;height:24px;border:0;padding:0;color:transparent;background:#151517;z-index:1000}</style><iframe title="NoemaTrace product capture"></iframe><button id="park" aria-label="Park pointer outside capture" tabindex="-1">Park</button><script type="module">
const params=new URLSearchParams(location.search),w=Number(params.get('width'))||1363,h=Number(params.get('height'))||912,view=params.get('view')||'',anchor=params.get('anchor')||'';for(const key of ['width','height','view','anchor'])params.delete(key);if(!params.has('showcase'))params.set('showcase','trace');const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';document.body.style.width=(w*2+64)+'px';document.body.style.height=(h*2+64)+'px';frame.src=new URL('../'+view+'?'+params+(anchor?'#'+anchor:''),location.href);
const park=document.querySelector('#park');park.addEventListener('pointerdown',e=>e.preventDefault());park.addEventListener('click',()=>window.scrollTo({left:0,top:0,behavior:'instant'}));
</script></html>
